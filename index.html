<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Premium Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #151515 0%, #050505 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Premium Floating Card */
        .card-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(127, 0, 255, 0.2);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            width: 380px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            transition: all 0.5s ease;
        }

        /* Upper Premium Header */
        .brand-header {
            color: #7f00ff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            text-shadow: 0 0 20px rgba(127, 0, 255, 0.6);
        }

        .input-group {
            margin-bottom: 22px;
            text-align: left;
        }

        label {
            color: #888;
            font-size: 11px;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            outline: none;
            color: #fff;
            border-radius: 12px;
            font-size: 15px;
            transition: 0.3s ease;
        }

        input:focus {
            border-color: #7f00ff;
            box-shadow: 0 0 15px rgba(127, 0, 255, 0.3);
        }

        /* Send OTP Button */
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6200ea 0%, #7f00ff 100%);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(127, 0, 255, 0.3);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(127, 0, 255, 0.5);
        }

        /* Hidden Sections */
        .hidden {
            display: none !important;
        }

        /* Premium Spinner Animation */
        .spinner {
            width: 55px;
            height: 55px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border-top-color: #7f00ff;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .waiting-text {
            color: #aaa;
            font-size: 15px;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }

        .otp-display {
            background: rgba(127, 0, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            color: #a040ff;
            font-family: monospace;
            font-size: 19px;
            letter-spacing: 3px;
            margin: 20px 0;
            border: 1px dashed rgba(127, 0, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div class="card-container" id="loginCard">
        <div class="brand-header">EDUCATIONAL</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter Username" required>
            </div>
            <div class="input-group">
                <label>User ID</label>
                <input type="text" id="userId" placeholder="Enter User ID" required>
            </div>
            <div class="input-group">
                <label>User Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Send OTP</button>
        </form>
    </div>

    <!-- 2. WAITING SCREEN -->
    <div class="card-container hidden" id="waitingCard">
        <div class="brand-header">EDUCATIONAL</div>
        <div class="spinner"></div>
        <p class="waiting-text">Please wait... Generating Secure OTP</p>
    </div>

    <!-- 3. OTP SCREEN -->
    <div class="card-container hidden" id="otpCard">
        <div class="brand-header">EDUCATIONAL</div>
        
        <!-- Generated OTP Display -->
        <div class="otp-display">YOUR OTP IS: <span id="mockOtp">0000</span></div>

        <form id="otpForm" onsubmit="handleOtpSubmit(event)">
            <div class="input-group">
                <label>Enter Secure OTP</label>
                <input type="text" id="otpInput" maxlength="4" placeholder="••••" required style="text-align: center; font-size: 22px; letter-spacing: 8px;">
            </div>
            <button type="submit" class="btn">Verify & Proceed</button>
        </form>
    </div>

    <script>
        let correctOtp = "";

        function handleLogin(event) {
            event.preventDefault(); // फॉर्म को रीलोड होने से रोकने के लिए
            
            // लॉगिन छुपाएं और वेटिंग बॉक्स दिखाएं
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('waitingCard').classList.remove('hidden');

            // 2.5 सेकंड का वेटिंग टाइम (एनीमेशन के लिए) उसके बाद OTP आएगा
            setTimeout(() => {
                // 4 अंकों का ऑटोमैटिक OTP जनरेट करें
                correctOtp = Math.floor(1000 + Math.random() * 9000).toString();
                document.getElementById('mockOtp').innerText = correctOtp;

                // वेटिंग बॉक्स छुपाएं और OTP स्क्रीन खोलें
                document.getElementById('waitingCard').classList.add('hidden');
                document.getElementById('otpCard').classList.remove('hidden');
            }, 2500); 
        }

        function handleOtpSubmit(event) {
            event.preventDefault();
            const userOtp = document.getElementById('otpInput').value;

            if (userOtp === correctOtp) {
                // सफल होने पर सीधे index.html मुख्य पेज पर भेजें
                window.location.href = "index.html";
            } else {
                alert("गलत OTP! कृपया फिर से सही कोड दर्ज करें।");
            }
        }
    </script>
</body>
</html>
