<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Hub - Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #151515 0%, #050505 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Branding Banner */
        .hub-banner {
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid #00d2ff;
            padding: 15px 30px;
            border-radius: 12px;
            background: rgba(0, 210, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .hub-title {
            color: #00d2ff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        /* Card Setup */
        .card-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(127, 0, 255, 0.25);
            backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .brand-header {
            color: #7f00ff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            color: #aaa;
            font-size: 11px;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            color: #fff;
            border-radius: 12px;
            font-size: 15px;
        }

        input:focus {
            border-color: #7f00ff;
            box-shadow: 0 0 15px rgba(127, 0, 255, 0.35);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6200ea 0%, #7f00ff 100%);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        .hidden { display: none !important; }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border-top-color: #7f00ff;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .otp-display {
            background: rgba(127, 0, 255, 0.12);
            padding: 12px;
            border-radius: 10px;
            color: #b866ff;
            font-family: monospace;
            font-size: 18px;
            margin: 20px 0;
            border: 1px dashed rgba(127, 0, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="hub-banner">
        <div class="hub-title">&lt; CODE STUDY &gt;</div>
        <div style="color: #ff007f; font-size: 11px; margin-top: 4px;">WEB DEVELOPMENT HUB</div>
    </div>

    <!-- LOGIN SCREEN -->
    <div class="card-container" id="loginCard">
        <div class="brand-header">EDUCATIONAL LOGIN</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter Username" required>
            </div>
            <div class="input-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" placeholder="Enter User ID" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Send OTP &amp; Proceed</button>
        </form>
    </div>

    <!-- WAITING SCREEN -->
    <div class="card-container hidden" id="waitingCard">
        <div class="brand-header">EDUCATIONAL</div>
        <div class="spinner"></div>
        <p style="color:#aaa; font-size:14px;">Generating Secure OTP...</p>
    </div>

    <!-- OTP SCREEN -->
    <div class="card-container hidden" id="otpCard">
        <div class="brand-header">VERIFY OTP</div>
        <div class="otp-display">YOUR OTP IS: <strong id="mockOtp">0000</strong></div>

        <form id="otpForm" onsubmit="handleOtpSubmit(event)">
            <div class="input-group">
                <label for="otpInput">Enter OTP Code</label>
                <input type="text" id="otpInput" maxlength="4" style="text-align: center; font-size: 22px;" required>
            </div>
            <button type="submit" class="btn">Verify &amp; Open Portal</button>
        </form>
    </div>

    <script>
        let correctOtp = "";

        function handleLogin(event) {
            event.preventDefault();
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('waitingCard').classList.remove('hidden');

            setTimeout(() => {
                correctOtp = Math.floor(1000 + Math.random() * 9000).toString();
                document.getElementById('mockOtp').innerText = correctOtp;
                document.getElementById('waitingCard').classList.add('hidden');
                document.getElementById('otpCard').classList.remove('hidden');
            }, 1800); 
        }

        function handleOtpSubmit(event) {
            event.preventDefault();
            const otpInput = document.getElementById('otpInput');

            if (otpInput.value === correctOtp) {
                // Correct Redirection -> Redirects directly to Menu
                window.location.href = "menu.html";
            } else {
                alert("गलत OTP! कृपया दोबारा प्रयास करें।");
                otpInput.value = "";
            }
        }
    </script>
</body>
</html>
