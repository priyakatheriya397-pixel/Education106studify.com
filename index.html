<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studyfy Premium | Educational Portal</title>
    <!-- Google Fonts link fixed -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4f46e5;    
            --secondary-color: #06b6d4;  
            --dark-bg: #0f172a;          
            --light-bg: #f8fafc;         
            --text-main: #334155;        
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            overflow-x: hidden;
        }

        /* Premium Sticky Navbar */
        header {
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .logo span {
            color: var(--secondary-color);
        }

        nav ul {
            display: flex;
            list-style: none;
            align-items: center;
        }

        nav ul li {
            margin-left: 15px;
        }

        nav ul li a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            transition: color 0.3s;
        }

        nav ul li a:hover, nav ul li a.active {
            color: white;
        }

        /* Logout button styling in nav */
        .nav-logout {
            background: rgba(225, 29, 72, 0.2);
            color: #f43f5e !important;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid rgba(225, 29, 72, 0.4);
            transition: all 0.3s ease;
        }
        .nav-logout:hover {
            background: #e11d48;
            color: white !important;
        }

        /* Hero Section Setup */
        .hero {
            position: relative;
            width: 100%;
            min-height: 100vh; 
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #111827);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero-content {
            position: relative;
            color: white;
            max-width: 600px;
            padding: 0 24px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .badge {
            background: rgba(6, 182, 212, 0.15);
            color: var(--secondary-color);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(6, 182, 212, 0.3);
            display: inline-block;
            margin-bottom: 15px;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            display: inline-block;
            text-align: center;
            flex: 1;
            max-width: 140px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- Premium Navigation Bar -->
    <header>
        <div class="logo">Study<span>fy</span></div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="login.html" class="nav-logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <span class="badge">E-Learning Platform</span>
            <h1>Smart Education <br>For Smart Learners</h1>
            <p>Premium study materials, interactive video modules, and specialized question banks designed to boost your academic growth.</p>
            
            <div class="hero-buttons">
                <!-- connected with start-learn.html -->
                <a href="start-learn.html" class="btn btn-primary">Start Learn</a>
                
                <!-- connected with explore.html -->
                <a href="explore.html" class="btn btn-secondary">Explore</a>
            </div>
        </div>
    </section>

</body>
</html>
