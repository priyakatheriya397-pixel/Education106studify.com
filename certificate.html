<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate of Completion</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0b1325;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* Dynamic Name Control Section */
        .input-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(10px);
        }

        .input-container label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ffd700;
            font-weight: 600;
        }

        .input-container input {
            padding: 12px 16px;
            width: 80%;
            max-width: 350px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #050a14;
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
            margin-bottom: 12px;
        }

        .input-container input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .gen-btn {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #000;
            border: none;
            padding: 10px 24px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .gen-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        /* Certificate Container */
        .cert-card {
            background: #ffffff;
            color: #1a1a1a;
            width: 100%;
            max-width: 650px;
            border: 12px solid #ffd700;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .cert-title {
            font-size: 26px;
            font-weight: 800;
            color: #1a2536;
            letter-spacing: 2px;
        }

        .cert-subtitle {
            font-size: 11px;
            color: #666;
            letter-spacing: 1.5px;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        /* User Name Display */
        .user-name {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            color: #4b32a2;
            margin: 15px 0;
            border-bottom: 2px solid #ddd;
            display: inline-block;
            padding: 0 30px 10px;
            min-width: 280px;
        }

        .cert-body {
            font-size: 13px;
            color: #444;
            line-height: 1.6;
            margin: 20px auto;
            max-width: 480px;
        }

        .footer-signatures {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 35px;
        }

        .sig-box {
            text-align: center;
        }

        .sig-title {
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: #222;
        }

        .sig-label {
            font-size: 9px;
            color: #777;
            border-top: 1px solid #ccc;
            padding-top: 4px;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 800;
            font-size: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Print Hide Controls */
        @media print {
            .input-container, .action-buttons {
                display: none !important;
            }
            body {
                background: white;
            }
            .cert-card {
                box-shadow: none;
            }
        }

        .action-buttons {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-print { background: #28a745; color: white; }
        .btn-home { background: #007bff; color: white; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <!-- 1. Custom Name Form -->
    <div class="input-container">
        <label for="nameInput">अपना नाम दर्ज करें (Enter Your Name):</label>
        <input type="text" id="nameInput" placeholder="उदा. Rahul Sharma" autocomplete="off">
        <br>
        <button class="gen-btn" onclick="updateName()">Update Certificate</button>
    </div>

    <!-- 2. Live Certificate -->
    <div class="cert-card">
        <div class="cert-title">CERTIFICATE OF COMPLETION</div>
        <div class="cert-subtitle">THIS IS PROUDLY PRESENTED TO</div>

        <!-- Dynamic Output Name -->
        <div class="user-name" id="certNameDisplay">Your Name Here</div>

        <p class="cert-body">
            For successfully demonstrating dedication, knowledge, and excellence in completing the 
            <strong>Educational Premium Learning Course</strong>.
        </p>

        <div class="footer-signatures">
            <div class="sig-box">
                <div class="sig-title">Studyfy Portal</div>
                <div class="sig-label">AUTHORIZED INSTRUCTOR</div>
            </div>

            <div class="badge">OFFICIAL</div>

            <div class="sig-box">
                <div class="sig-title">Verified</div>
                <div class="sig-label">DATE OF ISSUE</div>
            </div>
        </div>
    </div>

    <!-- 3. Actions -->
    <div class="action-buttons">
        <button class="btn btn-print" onclick="window.print()">🖨️ Print / Download PDF</button>
        <a href="menu.html" class="btn btn-home">🏠 Back to Home</a>
    </div>

    <script>
        function updateName() {
            const inputVal = document.getElementById('nameInput').value.trim();
            const displayObj = document.getElementById('certNameDisplay');
            if (inputVal !== "") {
                displayObj.innerText = inputVal;
            } else {
                alert("कृपया अपना नाम दर्ज करें!");
            }
        }
    </script>
</body>
</html>
