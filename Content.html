<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Classroom | Studyfy</title>
    <!-- Google Fonts link to correctly load Poppins and Alex Brush cursive styles -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 3D Real Space Deep Nebula Background */
        body {
            background: radial-gradient(circle at center, #05071a 0%, #020208 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 5%;
            position: relative;
            font-family: 'Poppins', sans-serif;
        }

        /* Real Starfield Effect */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(#fff, rgba(255,255,255,.3) 1px, transparent 20px),
                radial-gradient(#fff, rgba(255,255,255,.2) 1.5px, transparent 30px);
            background-size: 300px 300px, 450px 450px;
            opacity: 0.5;
            z-index: 0;
        }

        /* Top Navigation Header */
        .space-nav {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
        }

        .back-btn {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            background: linear-gradient(135deg, #e11d48, #9333ea);
            padding: 10px 20px;
            border-radius: 8px;
            margin-right: 20px;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* --- Real 3D Solar System Simulation --- */
        .universe-box {
            position: relative;
            width: 100%;
            height: 320px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* 🔥 DEEP RED REALISTIC SUN */
        .sun {
            position: absolute;
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #ffea00 0%, #ff3700 50%, #b30000 100%);
            border-radius: 50%;
            box-shadow: 0 0 45px #ff3700, 0 0 90px rgba(179, 0, 0, 0.6);
            z-index: 5;
        }

        /* Real Orbit Line 1 (Earth Orbit) */
        .orbit-earth {
            position: absolute;
            width: 170px;
            height: 170px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: spinOrbit 15s linear infinite;
            z-index: 2;
        }

        /* 🌍 REAL GLOWING EARTH */
        .earth {
            position: absolute;
            top: -14px;
            left: 71px;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 35% 35%, #00d2ff, #0044ff 70%, #001133);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        /* Real Orbit Line 2 (Mars Orbit) */
        .orbit-mars {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            animation: spinOrbit 25s linear infinite;
            z-index: 1;
        }

        /* 🔴 MARS (Red Planet) */
        .mars {
            position: absolute;
            top: -11px;
            left: 119px;
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 35% 35%, #ff7b54, #c0392b 70%, #4a0000);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(192, 57, 43, 0.5);
        }

        @keyframes spinOrbit {
            100% { transform: rotate(360deg); }
        }

        /* --- Premium Card Styling --- */
        .welcome-card {
            position: relative;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 25px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            z-index: 2;
        }

        /* ✍️ Beautiful Cursive Styling for Heading and Text */
        .cursive-title {
            font-family: 'Alex Brush', cursive;
            font-size: 42px;
            color: #06b6d4;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            letter-spacing: 1px;
        }

        .cursive-text {
            font-family: 'Alex Brush', cursive;
            font-size: 28px;
            color: #cbd5e1;
            line-height: 1.3;
            margin-bottom: 25px;
        }

        .edu-btn {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            width: 100%;
        }

        .edu-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #1d4ed8, #60a5fa);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>

    <!-- Back Navigation -->
    <div class="space-nav">
        <a href="explore.html" class="back-btn">&larr; Back</a>
        <h2>Cosmic Classroom</h2>
    </div>

    <!-- 3D Real Look Solar System -->
    <div class="universe-box">
        <div class="sun"></div>
        <div class="orbit-earth"><div class="earth"></div></div>
        <div class="orbit-mars"><div class="mars"></div></div>
    </div>

    <!-- Premium Dashboard Card -->
    <div class="welcome-card">
        <h3 class="cursive-title">Welcome to Cosmic Portal</h3>
        <p class="cursive-text">Start your premium learning journey across the stars...</p>
        
        <div class="action-container">
            <!-- target="_blank" लगाने से बटन दबाते ही start-lerning.html नए पेज पर खुलेगा -->
            <a href="start-lerning.html" target="_blank" class="edu-btn">🚀 Start Coding Lessons</a>
        </div>
    </div>

</body>
</html>
