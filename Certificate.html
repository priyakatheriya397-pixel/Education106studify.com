<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Premium Certificate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        /* Top Message (Green Cursive Style) */
        .premium-text {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 2rem;
            color: #22c55e;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
            line-height: 1.3;
        }
        /* Smaller, Rounder, Pure CSS Golden Certificate */
        .certificate-frame {
            width: 100%;
            max-width: 420px;
            background: #fffdf4; /* Rich Ivory Paper */
            border: 10px solid #d4af37; /* Bright Shiny Gold Border */
            border-radius: 30px; /* कोनों को पूरी तरह गोल किया */
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.4);
            text-align: center;
            color: #1e293b;
            position: relative;
            overflow: hidden;
        }
        /* Red & Gold Corner Ribbon/Band */
        .gift-ribbon {
            position: absolute;
            top: 15px;
            right: -30px;
            width: 120px;
            background: #dc2626;
            color: #fef08a;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 4px 0;
            transform: rotate(45deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            letter-spacing: 1px;
            border: 1px solid #d4af37;
        }
        .cert-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #aa7c11;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .cert-sub {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .cert-present {
            font-size: 0.9rem;
            font-style: italic;
            color: #475569;
            margin-bottom: 10px;
        }
        /* Interactive Name Input Area */
        .name-space-container {
            margin: 20px 0;
        }
        .name-input-field {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 2.2rem;
            color: #1e293b;
            font-weight: bold;
            text-align: center;
            border: none;
            border-bottom: 3px dashed #b38728; /* सुंदर गोल्डन डैश अंडरलाइन */
            background: transparent;
            width: 90%;
            outline: none;
            padding-bottom: 5px;
        }
        .cert-done {
            font-size: 0.85rem;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 0 10px;
        }
        /* Golden Badge Visual inside code */
        .badge-box {
            display: inline-block;
            position: relative;
            margin-top: 5px;
        }
        .gold-badge {
            font-size: 2.8rem;
            line-height: 1;
        }
        /* Bottom Message (Orange/Gold Style) */
        .screenshot-text {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 2.5rem;
            color: #f59e0b;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body>

    <!-- Top Message -->
    <div class="premium-text">
        If you want your original certificate, please pay Rs 40.
    </div>

    <!-- 100% Pure HTML/CSS Premium Certificate Card -->
    <div class="certificate-frame">
        <!-- Gift Ribbon Corner -->
        <div class="gift-ribbon">PREMIUM ★</div>
        
        <div class="cert-title">Certificate</div>
        <div class="cert-sub">of Achievement</div>
        
        <div class="cert-present">This is proudly presented to</div>
        
        <!-- User Input Row -->
        <div class="name-space-container">
            <input type="text" class="name-input-field" placeholder="Type Name Here..." value="">
        </div>
        
        <div class="cert-done">For successfully completing all the challenges and levels with outstanding performance.</div>
        
        <!-- Big Gold Seal Badge -->
        <div class="badge-box">
            <span class="gold-badge">🎖️</span>
        </div>
    </div>

    <!-- Bottom Message -->
    <div class="screenshot-text">
        Screenshot It Now Only!
    </div>

</body>
</html>
