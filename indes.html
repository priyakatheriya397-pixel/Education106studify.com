<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #0b0b0d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #13131a;
            border: 2px solid #221a35;
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }
        .title {
            color: #a855f7; /* Neon Purple */
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 10px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.2s;
        }
        .input-group input:focus {
            border-color: #a855f7;
        }
        .submit-btn {
            width: 100%;
            background: #6d28d9; /* Deep Purple */
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.3);
            text-decoration: none;
            display: inline-block;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="title">Educational</div>
        
        <!-- Username Input -->
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter Username" required>
        </div>

        <!-- User ID Input -->
        <div class="input-group">
            <label>User ID</label>
            <input type="text" placeholder="Enter User ID">
        </div>

        <!-- Password Input -->
        <div class="input-group">
            <label>User Password</label>
            <input type="password" placeholder="••••••••">
        </div>

        <!-- यह बटन सीधे indes.html पर ले जाएगा -->
        <button class="submit-btn" onclick="loginAndRedirect()">Send OTP</button>
    </div>

    <script>
        function loginAndRedirect() {
            // यूजर का नाम मेमोरी में सेव करना (सर्टिफिकेट के लिए)
            var userNameInput = document.getElementById("username").value;
            if(userNameInput.trim() !== "") {
                localStorage.setItem("userRegisteredName", userNameInput);
            } else {
                localStorage.setItem("userRegisteredName", "Student");
            }
            
            // अब बटन दबाते ही सीधे 'indes.html' (E-Learning Platform) खुलेगा
            window.location.href = "indes.html";
        }
    </script>

</body>
</html>
